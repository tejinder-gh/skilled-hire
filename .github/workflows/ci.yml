name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: marketplace, POSTGRES_PASSWORD: marketplace, POSTGRES_DB: marketplace }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace
      JWT_SECRET: ci-test-secret-must-be-replaced
      MARKETPLACE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
